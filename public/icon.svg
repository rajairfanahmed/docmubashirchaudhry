<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- docmubashirchaudhary Official Brand Emblem -->
  <defs>
    <linearGradient id="bookShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="quillGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Deep Pakistan Green Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="104" fill="#01411C"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#047857" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Open Book Symbol (White / Slate-100) -->
  <g transform="translate(64, 110)">
    <!-- Left Page -->
    <path d="M192 260 C130 230 50 232 10 240 L10 50 C50 42 130 40 192 70 Z" fill="url(#bookShade)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Right Page -->
    <path d="M192 260 C254 230 334 232 374 240 L374 50 C334 42 254 40 192 70 Z" fill="url(#bookShade)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Spine Ridge -->
    <line x1="192" y1="65" x2="192" y2="265" stroke="#94A3B8" stroke-width="4"/>

    <!-- Left Page Text Guidelines -->
    <line x1="40" y1="80" x2="160" y2="92" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="115" x2="160" y2="127" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="150" x2="160" y2="162" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="185" x2="130" y2="195" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Page Text Guidelines -->
    <line x1="224" y1="92" x2="344" y2="80" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="224" y1="127" x2="344" y2="115" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="224" y1="162" x2="344" y2="150" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="254" y1="195" x2="344" y2="185" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Golden Quill / Pen Accent (Warm Amber / Gold #D97706) -->
  <g transform="translate(140, 60) rotate(-18 100 100)">
    <!-- Quill Feather Body -->
    <path d="M120 20 C160 50 170 120 150 180 C135 150 120 140 100 135 C115 110 110 70 85 45 C100 35 110 25 120 20 Z" fill="url(#quillGold)"/>
    <!-- Quill Shaft / Nib -->
    <path d="M100 135 L60 220 L75 224 L110 155 Z" fill="#D97706"/>
    <!-- Nib Tip -->
    <polygon points="60,220 54,232 68,226" fill="#FEF08A"/>
    <!-- Quill Vane Details -->
    <line x1="120" y1="50" x2="105" y2="65" stroke="#FEF3C7" stroke-width="2"/>
    <line x1="135" y1="80" x2="115" y2="100" stroke="#FEF3C7" stroke-width="2"/>
    <line x1="145" y1="115" x2="120" y2="135" stroke="#FEF3C7" stroke-width="2"/>
  </g>
</svg>

