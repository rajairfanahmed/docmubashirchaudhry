name: Weekly Official Source Link Check

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  check-source-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check external official portal & geodata URLs
        run: npm run check:links

